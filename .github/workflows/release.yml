name: Release

# Push a tag like v0.1.0. Every binary is built by scripts/build-release.sh,
# so anyone can rebuild it and compare hashes (README, "Verify a release").
on:
  push:
    tags: ["v*"]
  # Manual run: builds and checks everything, publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Two builds of the same commit in different folders must be byte-identical.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: a
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: elsewhere/b
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - run: cargo install cargo-zigbuild@0.23.4 --locked
      - run: |
          for d in a elsewhere/b; do
            (cd "$d" && rustup target add x86_64-unknown-linux-musl &&
             BUILD=zigbuild scripts/build-release.sh x86_64-unknown-linux-musl)
          done
          for bin in termchat termchat-relay; do
            sha256sum a/target/x86_64-unknown-linux-musl/release/$bin elsewhere/b/target/x86_64-unknown-linux-musl/release/$bin
            cmp a/target/x86_64-unknown-linux-musl/release/$bin elsewhere/b/target/x86_64-unknown-linux-musl/release/$bin
          done

  build:
    needs: reproducible
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - if: matrix.zig
        run: cargo install cargo-zigbuild@0.23.4 --locked
      - shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          BUILD=${{ matrix.zig && 'zigbuild' || 'build' }} scripts/build-release.sh ${{ matrix.target }}
          dir=termchat-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/termchat${{ matrix.exe }} target/${{ matrix.target }}/release/termchat-relay${{ matrix.exe }} LICENSE README.md "$dir/"
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd "$dir" && sum termchat${{ matrix.exe }} termchat-relay${{ matrix.exe }} > BINARIES.sha256)
          # Windows Explorer opens .zip, not .tar.gz.
          if [ -n "${{ matrix.exe }}" ]; then 7z a -tzip "$dir.zip" "$dir" >/dev/null; else tar -czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            termchat-*.tar.gz
            termchat-*.zip

  # The Android app (ADR-011): signed with the release key from the secrets.
  android:
    needs: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;30.0.16248370" >/dev/null
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk@4.1.2 --locked
      - env:
          KEYSTORE_B64: ${{ secrets.TERMCHAT_KEYSTORE_B64 }}
          TERMCHAT_KEYSTORE_PASSWORD: ${{ secrets.TERMCHAT_KEYSTORE_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          # A manual run without the secrets still builds, unsigned.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export TERMCHAT_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          android/build-rust.sh
          (cd android && ./gradlew --no-daemon assembleRelease)
          rm -f "$RUNNER_TEMP/release.jks"
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release*.apk "termchat-${{ github.ref_name }}-android-arm64.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: termchat-*.apk

  # Run both installers against the archives just built, served locally.
  installers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: dist
      - shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum termchat-* > SHA256SUMS; else shasum -a 256 termchat-* > SHA256SUMS; fi
      # The local server is started inside the step that uses it: background
      # processes do not survive the end of a step on every runner.
      - if: runner.os != 'Windows'
        env:
          TERMCHAT_VERSION: ${{ github.ref_name }}
          TERMCHAT_BASE_URL: http://127.0.0.1:18765
          TERMCHAT_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          (cd dist && exec python3 -m http.server 18765 --bind 127.0.0.1 >/dev/null 2>&1) &
          for i in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:18765/SHA256SUMS && break; sleep 1; done
          sh scripts/install.sh
          "$TERMCHAT_INSTALL_DIR/termchat" --version
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          TERMCHAT_VERSION: ${{ github.ref_name }}
          TERMCHAT_BASE_URL: http://127.0.0.1:18765
        run: |
          Start-Process python -ArgumentList '-m', 'http.server', '18765', '--bind', '127.0.0.1' -WorkingDirectory (Resolve-Path dist) -WindowStyle Hidden
          foreach ($i in 1..30) {
            try { Invoke-WebRequest http://127.0.0.1:18765/SHA256SUMS -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          ./scripts/install.ps1
          & "$env:LOCALAPPDATA\Programs\termchat\termchat.exe" --version

  publish:
    needs: [build, installers, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: src
      - run: |
          sha256sum termchat-*.tar.gz termchat-*.zip termchat-*.apk > SHA256SUMS
          src/scripts/homebrew-formula.sh "${{ github.ref_name }}" SHA256SUMS > termchat.rb
      # Signed (Sigstore) statement: these files came from this repo, this commit,
      # this workflow. Verify with: gh attestation verify <file> --repo <owner>/termchat
      # Free GitHub plans attest public repositories only; while this one is
      # private the release ships with checksums alone.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            termchat-*.tar.gz
            termchat-*.zip
            termchat-*.apk
            SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" termchat-*.tar.gz termchat-*.zip termchat-*.apk SHA256SUMS termchat.rb --repo "${{ github.repository }}" --draft --generate-notes
