[package]
name = "termchat-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
termchat-proto = { path = "../crates/proto" }
# ADR-039: the webhook body parser; no Tor needed for it.
termchat = { path = "../crates/client", default-features = false }
# ADR-044: the image decoder with its limits.
termchat-engine = { path = "../crates/engine", default-features = false }

# Not part of the main workspace: needs nightly.
[workspace]

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"

[[bin]]
name = "inner"
path = "fuzz_targets/inner.rs"

[[bin]]
name = "client_frame"
path = "fuzz_targets/client_frame.rs"

[[bin]]
name = "server_frame"
path = "fuzz_targets/server_frame.rs"

[[bin]]
name = "invite"
path = "fuzz_targets/invite.rs"

[[bin]]
name = "group"
path = "fuzz_targets/group.rs"

[[bin]]
name = "alert"
path = "fuzz_targets/alert.rs"

[[bin]]
name = "picture"
path = "fuzz_targets/picture.rs"
test = false
doc = false
