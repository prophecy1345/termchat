# cargo-deny config. Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste: proc-macro used at compile time by Arti crates (ADR-004); no runtime
    # code, no known vulnerability. Drop once Arti moves off it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time proc-macro pulled in by arti" },
    # basic-toml: read at compile time by askama_derive, which UniFFI uses to
    # generate the Kotlin bindings; no runtime code, no known vulnerability.
    # Drop once UniFFI's askama moves to toml.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained compile-time dependency of uniffi's askama_derive" },
    # rsa "Marvin" timing attack needs private-key operations (decrypt/sign). rsa
    # comes in through Arti's key-format crates; a Tor *client* only verifies
    # legacy RSA relay signatures, and termchat never creates an RSA private key.
    { id = "RUSTSEC-2023-0071", reason = "no RSA private-key operations in a Tor client" },
]

[licenses]
version = 2
# Licenses compatible with AGPL-3.0-or-later. Extend only with a reason in the commit message.
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla's CA list as data, in webpki-roots: TLS roots on Android (ADR-011).
    "CDLA-Permissive-2.0",
    # Public-domain style, pulled in by Arti (ADR-004).
    "CC0-1.0",
    "Unlicense",
    # File-level copyleft, GPL-compatible (secondary license clause); pulled in by Arti.
    "MPL-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
