# cargo-deny config. Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste: proc-macro used at compile time by Arti crates (ADR-004); no runtime
    # code, no known vulnerability. Drop once Arti moves off it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time proc-macro pulled in by arti" },
    # basic-toml: read at compile time by askama_derive, which UniFFI uses to
    # generate the Kotlin bindings; no runtime code, no known vulnerability.
    # Drop once UniFFI's askama moves to toml.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained compile-time dependency of uniffi's askama_derive" },
    # rsa "Marvin" timing attack needs private-key operations (decrypt/sign). rsa
    # comes in through Arti's key-format crates; a Tor *client* only verifies
    # legacy RSA relay signatures, and termchat never creates an RSA private key.
    { id = "RUSTSEC-2023-0071", reason = "no RSA private-key operations in a Tor client" },
    # zbus_names, zvariant, zvariant_derive: the D-Bus link from the desktop GUI
    # to the Linux screen reader (AccessKit over AT-SPI, ADR-018). It talks only
    # to the local session bus; unmaintained, no known vulnerability. Drop once
    # accesskit_unix moves to the maintained crates.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained, local D-Bus only, via accesskit_unix" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained, local D-Bus only, via accesskit_unix" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained, local D-Bus only, via accesskit_unix" },
    # SQLite before 3.54.0 can return stale memory when it opens a database
    # together with a crafted `-wal` file. Only our own files are opened: the
    # relay's database (umask 077) and Arti's directory cache in the private
    # state folder; whoever can plant files there already runs as that user.
    # The fix is libsqlite3-sys 0.39 (rusqlite 0.41), and Arti 0.47 and 0.48
    # (tor-dirmgr) require rusqlite below 0.41; one `links = "sqlite3"` per
    # build. Drop once Arti allows rusqlite 0.41.
    { id = "RUSTSEC-2026-0459", reason = "local files of our own only; rusqlite 0.41 is blocked by arti's tor-dirmgr" },
]

[licenses]
version = 2
# Licenses compatible with AGPL-3.0-or-later. Extend only with a reason in the commit message.
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla's CA list as data, in webpki-roots: TLS roots on Android (ADR-011).
    "CDLA-Permissive-2.0",
    # Public-domain style, pulled in by Arti (ADR-004).
    "CC0-1.0",
    "Unlicense",
    # File-level copyleft, GPL-compatible (secondary license clause); pulled in by Arti.
    "MPL-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Desktop GUI only (ADR-018), allowed per crate rather than for everything.
# Boost: the Windows clipboard. GPL-compatible.
[[licenses.exceptions]]
crate = "clipboard-win"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
crate = "error-code"
allow = ["BSL-1.0"]

# The fonts egui draws with, shipped as data inside the binary.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
