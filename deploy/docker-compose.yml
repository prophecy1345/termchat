# Relay behind Caddy (automatic HTTPS). Set your domain in Caddyfile and below.
services:
  relay:
    build: ..
    command: ["--host", "relay.example.org", "--trust-proxy"]
    volumes:
      - relay-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  relay-data:
  caddy-data:
