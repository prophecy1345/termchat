[package]
name = "termchat-core"
description = "Sans-IO core: E2EE sessions (vodozemac), protocol state, encrypted storage format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
termchat-proto = { version = "0.0.0", path = "../proto" }
thiserror = "2.0.21"
vodozemac = { version = "0.11.1", default-features = false, features = ["precomputed-tables"] }
zeroize = "1.9.1"
