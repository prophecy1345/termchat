[package]
name = "termchat-relay"
description = "Relay server: forwards encrypted envelopes, never sees plaintext."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["ws", "http1", "tokio"] }
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
termchat-core = { path = "../core" }
termchat-proto = { path = "../proto" }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The roots for UnifiedPush endpoints (ADR-012).
webpki-roots = "1.0.9"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "std"] }
