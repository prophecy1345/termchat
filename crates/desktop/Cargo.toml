[package]
name = "termchat-desktop"
description = "Desktop client (GUI) for termchat (ADR-018)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "termchat-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# No wgpu (OpenGL is enough for a chat window), no `links` (termchat opens
# nothing, ADR-017), no `persistence` (no window state on disk).
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
termchat-core = { path = "../core" }
termchat-engine = { path = "../engine", default-features = false }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
zeroize = "1.9.1"

[features]
default = ["tor"]
# Tor via Arti (ADR-004). Official releases ship with it.
tor = ["termchat-engine/tor"]

# Load libwayland at run time, as X11 already is: no link to system libraries,
# so the release can be cross-built with zig, and it starts without Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen"] }
