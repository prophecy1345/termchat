[package]
name = "termchat"
description = "Terminal client (TUI) for termchat."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
termchat-core = { path = "../core" }
termchat-engine = { path = "../engine", default-features = false }
tokio-tungstenite = "0.29.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
zeroize = "1.9.1"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }

[features]
default = ["tor"]
# Tor via Arti (ADR-004). Official releases ship with it.
tor = ["termchat-engine/tor"]
