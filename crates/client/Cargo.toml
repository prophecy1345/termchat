[package]
name = "termchat"
description = "Terminal client (TUI) for termchat."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
ratatui = "0.30"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
termchat-core = { version = "0.0.0", path = "../core" }
termchat-proto = { version = "0.0.0", path = "../proto" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
zeroize = "1.9.1"
zxcvbn = { version = "3.1.1", default-features = false }

[dev-dependencies]
termchat-relay = { path = "../relay" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }
