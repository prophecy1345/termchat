[package]
name = "termchat-engine"
description = "Shared client logic for termchat: transport, state, passwords."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "onion-service-client", "compression", "static-sqlite"], optional = true }
base64 = "0.22"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
termchat-core = { path = "../core" }
termchat-proto = { path = "../proto" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
tor-rtcompat = { version = "0.47", default-features = false, optional = true }
zeroize = "1.9.1"
zxcvbn = { version = "3.1.1", default-features = false }

# Android has no certificate bundle rustls-native-certs can read (ADR-011).
[target.'cfg(target_os = "android")'.dependencies]
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
termchat-relay = { path = "../relay" }

[features]
default = ["tor"]
# Tor via Arti (ADR-004). Official releases ship with it.
tor = ["dep:arti-client", "dep:tor-rtcompat"]
